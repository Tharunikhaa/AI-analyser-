[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ott-smart-testing-framework"
version = "1.0.0"
description = "AI-driven smart testing framework for OTT and Digital TV platforms"
readme = { text = "AI-driven smart testing framework", content-type = "text/plain" }

requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Contest Team" }
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "rich>=13.8.0,<14.0.0",
  "typer>=0.12.5,<1.0.0",
  "uvicorn>=0.30.6,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0"
]
web = [
  "playwright>=1.49.0,<2.0.0"
]

[project.scripts]
ott-test = "ott_testing_framework.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
